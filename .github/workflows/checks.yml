name: Source checks
on: [push, pull_request]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy pandas biopython
      - run: bash -n arcasHLA
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_upload.py
